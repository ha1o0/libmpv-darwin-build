name: iOS libmpv build
run-name: iOS libmpv ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-ios.ci.{0}', github.run_id) }}
on:
  push:
    branches: [darwin-ios-build]
    tags: ['v*-ios.*']

permissions:
  contents: read

concurrency:
  group: darwin-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-ios.ci.{0}', github.run_id) }}
  SOURCE_COMMIT: ${{ github.sha }}
  IOS_SMOKE_RUNTIME: auto

jobs:
  build:
    if: github.repository == 'ha1o0/libmpv-darwin-build'
    runs-on: [self-hosted, macOS, ARM64, libmpv-builder]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify inputs and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/mobile_release.py preflight
          python3 -m unittest discover -s tests -v
      - name: Resolve local Xcode
        id: xcode
        env:
          CONFIGURED_XCODE: ${{ vars.LIBMPV_XCODE_PATH }}
        run: |
          xcode="${CONFIGURED_XCODE:-$(xcode-select --print-path)}"
          xcode="${xcode%/Contents/Developer}"
          test -x "$xcode/Contents/Developer/usr/bin/xcodebuild"
          xcode="$(realpath "$xcode")"
          printf 'path=%s\n' "$xcode" >> "$GITHUB_OUTPUT"
          DEVELOPER_DIR="$xcode/Contents/Developer" python3 scripts/ios_load_smoke.py --runtime auto --preflight
      - name: Build only the universal iOS video archive
        env:
          XCODE_PATH: ${{ steps.xcode.outputs.path }}
          LOCAL_MAX_JOBS: ${{ vars.LIBMPV_MAX_JOBS || '2' }}
          LOCAL_BUILD_CORES: ${{ vars.LIBMPV_BUILD_CORES || '6' }}
        run: |
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          printf '%s\n' "$XCODE_PATH" > .nix/config/xcode.path
          printf '%s\n' "$RELEASE_TAG" > .nix/config/version.txt
          nix build -L --option sandbox true --option sandbox-fallback false \
            --option extra-sandbox-paths "$XCODE_PATH" \
            --max-jobs "$LOCAL_MAX_JOBS" --cores "$LOCAL_BUILD_CORES" \
            .#mk-out-archive-xcframeworks-ios-universal-video-full
      - name: Verify packaging, loading and MoltenVK output
        env:
          DEVELOPER_DIR: ${{ steps.xcode.outputs.path }}/Contents/Developer
          IOS_SMOKE_RENDER: '1'
        run: python3 scripts/mobile_release.py prepare
      - uses: actions/upload-artifact@v7
        with:
          name: verified-ios-libmpv-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-ios-libmpv-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Release verified assets for the existing iOS tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mobile_release.py publish
